<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Σελίδα δεν βρέθηκε - Ευγενία Δήμα</title>
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://evgeniadima.gr/404.html">
    
    <!-- Plausible Analytics - Privacy-friendly -->
    <script defer data-domain="evgeniadima.gr" src="https://plausible.io/js/script.js"></script>
    
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #2c1303;
            background-color: #f9f6ed;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        header {
            background-color: #4d290f;
            color: white;
            padding: 1rem;
            text-align: center;
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            text-decoration: none;
            color: white;
        }
        
        main {
            flex: 1;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            text-align: center;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #4d290f;
        }
        
        p {
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }
        
        .error-code {
            font-size: 8rem;
            font-weight: bold;
            color: rgba(77, 41, 15, 0.1);
            margin: 0;
            line-height: 1;
        }
        
        .button {
            display: inline-block;
            background-color: #4d290f;
            color: white;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.25rem;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        
        .button:hover {
            background-color: #2c1303;
        }
        
        footer {
            background-color: #f0e5ce;
            text-align: center;
            padding: 1rem;
            font-size: 0.9rem;
        }
        
        @media (max-width: 640px) {
            h1 {
                font-size: 2rem;
            }
            
            .error-code {
                font-size: 6rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <a href="/" class="logo" aria-label="Επιστροφή στην αρχική σελίδα">Ευγενία Δήμα</a>
    </header>
    
    <main>
        <p class="error-code">404</p>
        <h1>Η σελίδα δεν βρέθηκε</h1>
        <p>Η σελίδα που αναζητάτε δεν υπάρχει ή έχει μετακινηθεί.</p>
        <p>Παρακαλώ επιστρέψτε στην αρχική σελίδα ή επικοινωνήστε μαζί μας εάν χρειάζεστε βοήθεια.</p>
        <a href="/" class="button">Επιστροφή στην αρχική</a>
    </main>
    
    <footer>
        <p>&copy; <span id="year"></span> Ευγενία Δήμα - Ψυχολόγος - Ψυχοθεραπεύτρια</p>
    </footer>
    
    <script>
        // Update copyright year
        document.getElementById('year').textContent = new Date().getFullYear();
        
        // Track 404 error in analytics
        document.addEventListener('DOMContentLoaded', function() {
            if (window.plausible) {
                const currentUrl = window.location.href;
                const referrer = document.referrer;
                plausible('404', { props: { path: currentUrl, referrer: referrer }});
            }
        });
    </script>
</body>
</html>
