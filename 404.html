<head>

    <!-- Plausible Analytics - Privacy-friendly -->
    <script defer data-domain="petroslamb.github.io" src="https://plausible.io/js/script.file-downloads.hash.outbound-links.pageview-props.revenue.tagged-events.js"></script>
    <script>window.plausible = window.plausible || function() { (window.plausible.q = window.plausible.q || []).push(arguments) }</script>
    
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #2c1303;
            background-color: #f9f6ed;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        header {

            text-align: center;
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            text-decoration: none;
            color: white;
        }
        
        main {
            flex: 1;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            text-align: center;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #2c1303;
        }
        
        p {
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }
        
        .error-code {
            font-size: 8rem;
            font-weight: bold;
            color: rgba(142, 155, 128, 0.2);
            margin: 0;
            line-height: 1;
        }
        
        .button {
            display: inline-block;
            background-color: #8e9b80;
            color: white;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.25rem;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        
        .button:hover {
            background-color: #7d8a6f;
        }
        
        footer {
            background-color: #8e9b80;
            color: white;
            text-align: center;
            padding: 1rem;
            font-size: 0.9rem;
        }
        
        .footer-links {
            margin-top: 0.5rem;
        }
        
        .footer-links a {
            color: white;
            text-decoration: none;
            margin: 0 0.5rem;
        }
        
        .footer-links a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 640px) {
            h1 {
                font-size: 2rem;
            }
            
            .error-code {
                font-size: 6rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo" aria-label="Επιστροφή στην αρχική σελίδα">Ευγενία Δήμα</a>

    <main>
        <p class="error-code">404</p>
        <h1>Η σελίδα δεν βρέθηκε</h1>

    <footer>

        <div class="footer-links">
            <a href="privacy-policy.html">Πολιτική Απορρήτου</a>
            <a href="terms.html">Όροι Χρήσης</a>
        </div>
    </footer>
    
    <script>
        // Update copyright year
        document.getElementById('year').textContent = new Date().getFullYear();
        
        // Track 404 error in analytics
        document.addEventListener('DOMContentLoaded', function() {
            if (window.plausible) {
                const currentUrl = window.location.href;
                const referrer = document.referrer;
                plausible('404', { props: { path: currentUrl, referrer: referrer }});
            }
        });
    </script>
</body>
